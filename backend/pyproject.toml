[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "cryptography>=47.0.0",
    "fastapi[standard]>=0.136.1",
    "httpx>=0.28.1",
    "langchain>=1.2.16",
    "langchain-core>=1.3.2",
    "langchain-openai>=1.2.1",
    "langchain-text-splitters>=1.1.2",
    "langgraph>=1.1.9",
    "presidio-analyzer>=2.2.362",
    "presidio-anonymizer>=2.2.362",
    "pydantic-settings>=2.14.0",
    "pypdf>=6.10.2",
    "python-docx>=1.2.0",
    "python-jose[cryptography]>=3.5.0",
    "slowapi>=0.1.9",
    "supabase>=2.29.0",
    "tenacity>=9.1.4",
]

[tool.ruff.lint]
# ARG001 (unused function argument) fires on `request: Request` in every
# slowapi-decorated route. slowapi reads that parameter by name via function
# introspection at runtime — it IS used, just not by our code directly.
per-file-ignores = { "app/features/**/router.py" = ["ARG001"] }

# BLE001 (broad exception) is suppressed inline with # noqa: BLE001 comment
# where catching everything is justified (e.g. JWT key decoding fallback).
select = ["E", "F", "I", "UP", "B", "PL", "RUF"]

[tool.pylint.messages-control]
# W0613 unused-argument — request: Request is required by SlowAPI's rate-limiter
#   decorator, which reads it via FastAPI's dependency injection at runtime.
#   Ruff ARG001 is already suppressed per-file in per-file-ignores above.
# W0718 broad-exception-caught — intentional in graceful-degradation handlers
#   (DB writes / history loads) where any upstream failure must not abort the
#   chat stream. Ruff BLE001 is suppressed inline with # noqa: BLE001.
disable = ["W0613", "W0718"]

